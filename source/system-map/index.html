// ===== 聚合组间边 =====
function groupEdges() {
  const map = {};
  for (const [s, t, ty, desc] of E) {
    const gs = DOM_OF[s], gt = DOM_OF[t];
    if (gs === gt) continue;
    const key = [gs, gt].sort().join('|');
    (map[key] = map[key] || []).push([s, t, ty, desc]);
  }
  return Object.entries(map).map(([key, list]) => {
    const [a, b] = key.split('|');
    return { source: a, target: b, list, count: list.length };
  });
}

// ===== 总览视图 =====
function overviewOption() {
  const gnodes = DOMAIN_KEYS.map(k => {
    const members = N.filter(n => n[2] === k);
    const pending = members.filter(n => n[3] !== '✅').length;
    return {
      id: k, name: `${DOMAINS[k].name}\n${members.length} 系统${pending ? ` · ${pending} 待定稿` : ''}`,
      symbol: 'roundRect', symbolSize: [118, 66],
      itemStyle: { color: DOMAINS[k].color + '33', borderColor: DOMAINS[k].color, borderWidth: 2.5 },
      label: { show: true, color: '#eee', fontSize: 14, fontWeight: 600 },
      tooltip: { formatter: () => `<b>${DOMAINS[k].name}</b> · ${members.length} 系统<br>` +
        members.map(m => `${m[3]} ${m[0]} ${m[1]}`).join('<br>') + '<br><i style="color:#8aa">点击进入域详情</i>' },
    };
  });
  const glinks = groupEdges().map(g => ({
    source: g.source, target: g.target,
    lineStyle: { color: '#667', width: Math.min(1.5 + g.count * 0.55, 7), curveness: 0.12, opacity: 0.6 },
    label: { show: g.count >= 3, formatter: String(g.count), color: '#aab', fontSize: 11 },
    tooltip: { formatter: () => `<b>${DOMAINS[g.source].name} ⇄ ${DOMAINS[g.target].name}</b> · ${g.count} 条关系<br>` +
      g.list.map(([s, t, ty, d]) => `<span style="color:${LINK_TYPES[ty].color}">[${LINK_TYPES[ty].name}]</span> ${idName(s)} → ${idName(t)}:${d}`).join('<br>') },
  }));
  return {
    backgroundColor: '#1a1c22',
    tooltip: { confine: true, backgroundColor: '#23262e', borderColor: '#3a3f4b', textStyle: { color: '#cdd', fontSize: 12 } },
    series: [{
      type: 'graph', layout: 'force', roam: true,
      nodes: gnodes, links: glinks,
      force: { repulsion: 900, edgeLength: 220, gravity: 0.15 },
      emphasis: { focus: 'adjacency' },
      scaleLimit: { min: 0.5, max: 3 },
    }],
  };
}

// ===== 域详情视图 =====
function groupOption(domKey) {
  const inner = N.filter(n => n[2] === domKey).map(([id, name, dom, st, desc]) => ({
    id, name, status: st, desc,
    symbolSize: 34 + E.filter(e => e[0] === id || e[1] === id).length * 2.2,
    category: 0,
    label: { show: true, fontSize: 12, color: '#fff' },
    itemStyle: { color: DOMAINS[domKey].color, borderColor: STATUS_COLOR[st] || '#888', borderWidth: 3 },
    tooltip: { formatter: () => `<b>${id} ${name}</b> [${st}]<br>${desc}<br><i style="color:#8aa">点击打开策划案</i>` },
  }));
  // 外部代理节点(与该组有关系的每个外部系统一个)
  const innerIds = new Set(inner.map(n => n.id));
  const outerIds = new Set();
  E.forEach(([s, t]) => { if (innerIds.has(s)) outerIds.add(t); if (innerIds.has(t)) outerIds.add(s); });
  const outers = [...outerIds].filter(id => !innerIds.has(id)).map(id => {
    const [nid, name, ndom, nst] = nodeOf(id);
    return { id, name: `${name}(外)`, symbolSize: 16, category: 1, targetDom: ndom,
      label: { show: true, fontSize: 10, color: '#8899aa' },
      itemStyle: { color: '#3a3f4b', borderColor: DOMAINS[ndom].color, borderWidth: 1.5 },
      tooltip: { formatter: () => `<b>${nid} ${name}</b> · ${DOMAINS[ndom].name}(外部)<br><i style="color:#8aa">点击跳转到 ${DOMAINS[ndom].name} 细看,再点该系统打开策划案</i>` } };
  });
  const links = E.filter(([s, t]) => innerIds.has(s) || innerIds.has(t)).map(([s, t, ty, desc]) => ({
    source: s, target: t,
    lineStyle: { color: LINK_TYPES[ty].color, width: ty === 'loop' ? 2.4 : 1.6, curveness: 0.15, opacity: 0.8 },
    tooltip: { formatter: () => `<b>${idName(s)} → ${idName(t)}</b><br><span style="color:${LINK_TYPES[ty].color}">[${LINK_TYPES[ty].name}]</span> ${desc}` },
  }));
  return {
    backgroundColor: '#1a1c22',
    tooltip: { confine: true, backgroundColor: '#23262e', borderColor: '#3a3f4b', textStyle: { color: '#cdd', fontSize: 12 } },
    legend: [{ data: ['本域系统', '外部关联(代理)'], textStyle: { color: '#cdd' }, top: 8, right: 20 }],
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      categories: [{ name: '本域系统' }, { name: '外部关联(代理)' }],
      nodes: [...inner, ...outers], links,
      force: { repulsion: 420, edgeLength: [70, 170], gravity: 0.12, friction: 0.25 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 4, opacity: 1 } },
      label: { position: 'bottom', distance: 3 },
      scaleLimit: { min: 0.4, max: 3 },
    }],
  };
}

  }));
  const links = E.map(([s, t, ty, desc]) => ({

// ===== 视图切换 =====
const chart = echarts.init(document.getElementById('chart'));
let view = 'overview';
function syncButtons() {
  document.getElementById('backBtn').style.display = view !== 'overview' && view !== 'all' ? 'inline-block' : 'none';
  document.getElementById('allBtn').textContent = view === 'all' ? '⊞ 分组总览' : '⊘ 全展开';
}
function showOverview() {
  view = 'overview';
  document.getElementById('breadcrumb').innerHTML = '总览 · 7 域 44 系统 · <i>点击域组下钻(或点右上「全展开」)</i>';
  document.getElementById('detail').style.display = 'none';
  syncButtons();
  chart.setOption(overviewOption(), true);
}
function showAll() {
  view = 'all';
  document.getElementById('breadcrumb').innerHTML = '<b>全展开</b> · 44 系统一图 · 悬停边看关系 · 点击系统打开策划案 · 顶部图例可按域过滤';
  document.getElementById('detail').style.display = 'none';
  syncButtons();
  chart.setOption(allOption(), true);
}
function toggleAll() { view === 'all' ? showOverview() : showAll(); }
function showGroup(domKey) {
  view = domKey;
  const members = N.filter(n => n[2] === domKey);
  document.getElementById('breadcrumb').innerHTML =
    `<b>${DOMAINS[domKey].name}</b> · ${members.length} 系统 · 灰色小节点=外部关联(代理,点击跳域)`;
  document.getElementById('detail').style.display = 'none';
  syncButtons();
  chart.setOption(groupOption(domKey), true);
}
chart.on('click', p => {
  if (view === 'overview') {
    if (p.dataType === 'node' && DOMAIN_KEYS.includes(p.data.id)) showGroup(p.data.id);
    return;
  }
  if (view === 'all') {
    if (p.dataType === 'node') window.open(postUrl(p.data.id), '_blank');
    return;
  }
  if (p.dataType !== 'node') return;
  if (p.data.category === 1) {           // 外部代理节点 → 跳转到目标域
    if (p.data.targetDom) showGroup(p.data.targetDom);
    return;
  }
  window.open(postUrl(p.data.id), '_blank');  // 本域系统 → 打开策划案
});
// 详情面板改为按需保留:双击本域节点时显示上下游明细(左键已用于打开策划案)
chart.on('dblclick', p => {
  if (view === 'overview' || p.dataType !== 'node' || p.data.category !== 0) return;
  const d = document.getElementById('detail');
  const ins = E.filter(e => e[1] === p.data.id).map(e => `← <span style="color:${LINK_TYPES[e[2]].color}">[${LINK_TYPES[e[2]].name}]</span> ${idName(e[0])}:${e[3]}`);
  const outs = E.filter(e => e[0] === p.data.id).map(e => `→ <span style="color:${LINK_TYPES[e[2]].color}">[${LINK_TYPES[e[2]].name}]</span> ${idName(e[1])}:${e[3]}`);
  document.getElementById('detailBody').innerHTML =
    `<b>${p.data.id} ${p.data.name}</b> [${p.data.status}]<br>${p.data.desc}` +
    `<br><br><b style="color:#8e9aaf">━ 上游(${ins.length})</b><br>${ins.join('<br>') || '无'}` +
    `<br><br><b style="color:#4aa3df">━ 下游(${outs.length})</b><br>${outs.join('<br>') || '无'}` +
    `<br><br><i style="color:#8aa">左键单击 = 打开策划案</i>`;
  d.style.display = 'block';
});
window.addEventListener('resize', () => chart.resize());
showOverview();
